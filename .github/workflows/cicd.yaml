name: Petclinic CI/CD Pipeline

on:
  push:
    branches:
      - main
      - feature/devops-cicd

env:
  IMAGE_NAME: rjshsynectiks/petclinic

jobs:

  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build jar with Maven
        run: mvn clean package -DskipTests

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME:latest .

      - name: Push Docker image
        run: docker push $IMAGE_NAME:latest


  deploy-to-k3s:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Connect to WSL K3s via SSH and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.WSL_HOST }}
          username: labdev
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            kubectl set image deployment/petclinic petclinic=${{ env.IMAGE_NAME }}:latest || true
            kubectl rollout restart deployment petclinic
            kubectl rollout status deployment petclinic
